<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD35C"/>
      <stop offset="1" stop-color="#FF9F1C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F1EC"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#1668E3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 body inset 100px, ~185px corner radius -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>

  <!-- note card, slightly tilted -->
  <g transform="rotate(-6 470 480)" filter="url(#shadow)">
    <rect x="250" y="220" width="440" height="540" rx="48" fill="url(#paper)"/>
    <rect x="310" y="300" width="250" height="36" rx="18" fill="#2B2B2B"/>
    <rect x="310" y="385" width="320" height="24" rx="12" fill="#C9C4B8"/>
    <rect x="310" y="445" width="300" height="24" rx="12" fill="#C9C4B8"/>
    <rect x="310" y="505" width="220" height="24" rx="12" fill="#C9C4B8"/>
  </g>

  <!-- magnifying glass -->
  <g filter="url(#shadow)">
    <line x1="738" y1="738" x2="800" y2="800" stroke="#1B4FA8" stroke-width="64" stroke-linecap="round"/>
    <circle cx="615" cy="615" r="130" fill="#FFFFFF" fill-opacity="0.35" stroke="url(#lens)" stroke-width="44"/>
  </g>
</svg>
